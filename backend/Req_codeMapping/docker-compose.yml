version: '3.8'

# DevHouse26 On-Premises Docker Deployment
# For enterprise customers requiring data sovereignty
#
# Quick Start:
#   1. Copy this file and docker-compose.env to your server
#   2. Edit docker-compose.env with your settings
#   3. Run: docker-compose up -d
#   4. Access: http://localhost:3000
#
# Services:
#   - devhouse26-app: Main application (port 8000)
#   - devhouse26-web: Frontend dashboard (port 3000)
#   - postgres: Database (internal)
#   - redis: Cache & job queue (internal)
#   - nginx: Reverse proxy & SSL termination (port 80/443)

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: devhouse26-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-devhouse26}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${DB_NAME:-devhouse26}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devhouse26} -d ${DB_NAME:-devhouse26}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devhouse26-internal

  # Redis for caching and job queue
  redis:
    image: redis:7-alpine
    container_name: devhouse26-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devhouse26-internal

  # Backend API
  devhouse26-app:
    image: devhouse26/backend:latest
    container_name: devhouse26-app
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-devhouse26}:${DB_PASSWORD:-changeme_in_production}@postgres:5432/${DB_NAME:-devhouse26}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      
      # Security
      JWT_SECRET: ${JWT_SECRET:-generate_a_strong_secret_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-generate_a_32_byte_key}
      
      # Feature Flags
      ENABLE_BURNOUT_DETECTION: "true"
      ENABLE_ANTI_GAMING: "true"
      ENABLE_ROI_CALCULATOR: "true"
      ENABLE_CALENDAR_INTEGRATION: "${ENABLE_CALENDAR_INTEGRATION:-false}"
      
      # Email/SMTP (optional - for alerts)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@devhouse26.local}
      
      # Slack (optional - for alerts)
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # CORS (restrict to your domain in production)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      
      # Rate limiting
      RATE_LIMIT_REQUESTS: "1000"
      RATE_LIMIT_WINDOW: "3600"
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    networks:
      - devhouse26-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Dashboard
  devhouse26-web:
    image: devhouse26/frontend:latest
    container_name: devhouse26-web
    restart: unless-stopped
    build:
      context: ./Manager_Dashboard
      dockerfile: Dockerfile.frontend
    environment:
      # API endpoint (internal docker network)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      
      # Feature flags
      NEXT_PUBLIC_ENABLE_BURNOUT_TAB: "true"
      NEXT_PUBLIC_ENABLE_ROI_TAB: "true"
      NEXT_PUBLIC_ENABLE_ANTI_GAMING: "true"
      
    depends_on:
      - devhouse26-app
    networks:
      - devhouse26-internal

  # Background Worker (Celery)
  devhouse26-worker:
    image: devhouse26/backend:latest
    container_name: devhouse26-worker
    restart: unless-stopped
    command: celery -A tasks worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://${DB_USER:-devhouse26}:${DB_PASSWORD:-changeme_in_production}@postgres:5432/${DB_NAME:-devhouse26}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-generate_a_strong_secret_in_production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - postgres
      - redis
    volumes:
      - app_logs:/app/logs
    networks:
      - devhouse26-internal

  # Scheduler (Celery Beat)
  devhouse26-scheduler:
    image: devhouse26/backend:latest
    container_name: devhouse26-scheduler
    restart: unless-stopped
    command: celery -A tasks beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://${DB_USER:-devhouse26}:${DB_PASSWORD:-changeme_in_production}@postgres:5432/${DB_NAME:-devhouse26}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-generate_a_strong_secret_in_production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - postgres
      - redis
    networks:
      - devhouse26-internal

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: devhouse26-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - devhouse26-app
      - devhouse26-web
    networks:
      - devhouse26-internal

  # Extension Update Server (optional)
  # Serves VS Code extension updates for air-gapped environments
  extension-server:
    image: nginx:alpine
    container_name: devhouse26-extensions
    restart: unless-stopped
    volumes:
      - ./extensions:/usr/share/nginx/html/extensions:ro
    ports:
      - "8080:80"
    networks:
      - devhouse26-internal

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local
  app_uploads:
    driver: local
  nginx_logs:
    driver: local

networks:
  devhouse26-internal:
    driver: bridge
    internal: false
